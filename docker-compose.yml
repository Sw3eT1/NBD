version: '3.8'

services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    environment:
      - CASSANDRA_CLUSTER_NAME=library-cluster
      - CASSANDRA_SEEDS=cassandra-node1,cassandra-node2
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_NUM_TOKENS=256
    ports:
      - "9042:9042"
    volumes:
      - cassandra1_data:/var/lib/cassandra
    networks:
      cassandranet:
        ipv4_address: 172.24.0.10
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusgossip | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    environment:
      - CASSANDRA_CLUSTER_NAME=library-cluster
      - CASSANDRA_SEEDS=cassandra-node1,cassandra-node2
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_NUM_TOKENS=256
    depends_on:
      - cassandra-node1
    volumes:
      - cassandra2_data:/var/lib/cassandra
    networks:
      cassandranet:
        ipv4_address: 172.24.0.11
    healthcheck:
      test: ["CMD-SHELL", "nodetool statusgossip | grep -q running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  cassandranet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.24.0.0/16

volumes:
  cassandra1_data:
    driver: local
  cassandra2_data:
    driver: local